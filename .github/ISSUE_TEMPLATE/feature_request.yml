name: Feature request
description: 提出具體需求、使用情境與驗收方式
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 哪類使用者在什麼情境受到影響？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議行為
      description: 說明預期操作與結果，並註明手機／桌機及輔助使用需求。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 現有替代作法與限制。
  - type: textarea
    id: acceptance
    attributes:
      label: 驗收條件與測試方式
      description: 列出成功、失敗、loading／empty、nullable 資料情境，以及需要的 mock／瀏覽器／跨服務測試。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 契約、安全與隱私影響
      description: 是否影響 Better Auth、API、WebSocket、Body Profile、tracking states 或相機資料？不應傳送原始相機影格。
  - type: textarea
    id: references
    attributes:
      label: 參考資料或畫面草圖
      description: 請勿附上憑證或未經同意的個人影像。
