name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      reports: ${{ steps.reports.outcome }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personai_test
          POSTGRES_USER: personai
          POSTGRES_PASSWORD: personai_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personai -d personai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://personai:personai_test_only@127.0.0.1:5432/personai_test
      PERSONAI_AUTH_TEST_DATABASE_URL: postgresql://personai:personai_test_only@127.0.0.1:5432/personai_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      AUTH_ISSUER: http://localhost:3000
      AUTH_AUDIENCE: personai-api
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_WS_BASE: ws://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS personai_auth"
      - run: bun run auth:migrate
      - run: bun run lint
      - run: bun run typecheck
      # One Vitest invocation supplies the test gate, coverage, and JUnit.
      - run: bun run test:coverage
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Preserve reports even when a test fails
        id: reports
        if: ${{ !cancelled() && (hashFiles('coverage/lcov.info') != '' || hashFiles('test-results/*.xml') != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            coverage/lcov.info
            test-results/vitest.xml
            test-results/playwright.xml
          if-no-files-found: error
          retention-days: 14

  codecov:
    needs: quality
    if: ${{ !cancelled() && needs.quality.outputs.reports == 'success' }}
    runs-on: ubuntu-latest
    # Only the report job can request OIDC; it never executes project code.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-test-reports
      - name: Locate test reports
        id: junit
        shell: bash
        run: |
          reports=()
          for file in test-results/vitest.xml test-results/playwright.xml; do
            if [[ -f "$file" ]]; then reports+=("$file"); fi
          done
          joined=$(IFS=,; echo "${reports[*]}")
          echo "files=$joined" >> "$GITHUB_OUTPUT"
      - name: Upload coverage (informational rollout)
        if: ${{ hashFiles('coverage/lcov.info') != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea # v7
        with:
          # Fork PRs use tokenless upload because GitHub may deny their OIDC permission.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          flags: frontend
      - name: Upload test analytics (informational rollout)
        if: ${{ !cancelled() && steps.junit.outputs.files != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea # v7
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: ${{ steps.junit.outputs.files }}
          report_type: test_results
          disable_search: true
          fail_ci_if_error: false
